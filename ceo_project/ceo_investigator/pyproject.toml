# Sem seção [project]/build-backend de propósito: o pacote não precisa ser
# instalado. 'pythonpath' faz o pytest achar 'src' a partir de ceo_investigator/,
# e o agente roda (de dentro de ceo_investigator/) com  py -m src.data.investigator

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: chama a API do Gemini de verdade (requer GEMINI_API_KEY)",
]
